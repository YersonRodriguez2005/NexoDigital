<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/Logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070E1E" />

    <!-- ─── SEO Local Avanzado (Title & Meta) ─── -->
    <!-- MENTOR TIP: Google lee de izquierda a derecha. Pon las palabras clave más importantes al inicio. -->
    <title>Agencia de Desarrollo de Software en Neiva, Huila | Nexo Digital</title>
    <meta name="description" content="Nexo Digital es la agencia líder de desarrollo de software en Neiva, Huila. Creamos sistemas POS, facturación, aplicaciones móviles y plataformas web a la medida." />
    <meta name="keywords" content="desarrollo de software Neiva, programador Huila, software POS Neiva, sistemas de inventario Huila, desarrollo web Neiva, Nexo Digital" />
    <meta name="author" content="Nexo Digital" />
    <meta name="robots" content="index, follow" />
    
    <!-- URL Canónica apuntando a tu dominio profesional -->
    <link rel="canonical" href="https://agencianexodigital.co/" />

    <!-- ─── Open Graph (Facebook, LinkedIn, WhatsApp) ─── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agencianexodigital.co/" />
    <meta property="og:title" content="Nexo Digital | Desarrollo de Software a la medida en el Huila" />
    <meta property="og:description" content="Sistematiza tu comercio hoy. Descubre software de ventas e inventario accesible en Neiva." />
    <meta property="og:image" content="https://agencianexodigital.co/assets/og-image.png" />

    <!-- ─── Twitter Cards ─── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://agencianexodigital.co/" />
    <meta name="twitter:title" content="Nexo Digital | Software Empresarial en Neiva" />
    <meta name="twitter:description" content="Sistematiza tu comercio hoy. Descubre software de ventas e inventario accesible en Neiva." />
    <meta name="twitter:image" content="https://agencianexodigital.co/assets/og-image.png" />

    <!-- ─── Schema Markup (JSON-LD) para Local SEO ─── -->
    <!-- MENTOR TIP: Este es un código invisible para usuarios pero que Google AMA. Le dice exactamente qué eres y dónde estás. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Nexo Digital",
      "image": "https://agencianexodigital.co/assets/Logo1.png",
      "@id": "https://agencianexodigital.co/",
      "url": "https://agencianexodigital.co/",
      "telephone": "+573216393715",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Neiva",
        "addressRegion": "Huila",
        "addressCountry": "CO"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 2.9273,
        "longitude": -75.28189
      },
      "sameAs": [
        "https://www.facebook.com/NexoDigital"
      ]
    }
    </script>

    <!-- ─── Fonts ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
